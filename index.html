<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <!-- 加入这个库，替代原来的 qrcode.min.js -->
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.4/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 py-10">
    <div class="max-w-xl mx-auto p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-semibold mb-4 text-white">QR Code Generator</h1>

        <div class="mb-4">
            <label for="qrInput" class="block font-medium text-white mb-2">Enter text</label>
            <textarea id="qrInput" rows="4" class="w-full border border-gray-300 rounded-lg p-2 bg-gray-900 text-white" placeholder="Enter text to generate QR code"></textarea>
        </div>

        <button onclick="generateQRCode()" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600">Generate</button>
        <button onclick="convertToCSV()" class="bg-green-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-600 ml-2">Convert</button>
        <script>
        function convertToCSV() {
            const textarea = document.getElementById("qrInput");
            const lines = textarea.value
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            textarea.value = lines.join(', ');
        }
        </script>
        <button id="downloadLink" style="display: none;" class="mt-4 block text-blue-500 font-medium" download>Download SVG</button>

        <!-- GitHub Project and Profile Links -->
        <div class="mt-4">
            <p class="text-white">Check out the project on <a href="https://github.com/sayacs/qrcode-generator" class="text-blue-500 font-medium">GitHub</a></p>
            <p class="text-white">Visit my <a href="https://github.com/sayacs/" class="text-blue-500 font-medium">GitHub profile</a></p>
        </div>
    </div>

    <div class="max-w-xl mx-auto mt-8">
        <div id="qrcode" class="w-full flex justify-center"></div>
    </div>

    <script>
    const qrCode = new QRCodeStyling({
        width: 128,
        height: 128,
        type: "svg",
        data: "",
        image: "",
        dotsOptions: {
            color: "#000",
            type: "square"
        },
        backgroundOptions: {
            color: "#ffffff"
        }
    });

    qrCode.append(document.getElementById("qrcode"));

    function generateQRCode() {
        const text = document.getElementById("qrInput").value.trim();
        if (!text) {
            alert("Please enter some text!");
            return;
        }

        qrCode.update({
            data: text
        });

        // 显示下载链接
        const downloadLink = document.getElementById("downloadLink");
        downloadLink.onclick = () => qrCode.download({ name: "qrcode", extension: "svg" });
        downloadLink.style.display = "block";
    }
</script>

</body>

</html>
